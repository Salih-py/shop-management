name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Gradle Assemble APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Ensure Valid Gradle Wrapper JAR
      run: |
        cd android
        JAR_PATH="gradle/wrapper/gradle-wrapper.jar"
        if [ ! -f "$JAR_PATH" ] || ! jar tf "$JAR_PATH" >/dev/null 2>&1; then
          echo "Gradle wrapper JAR is missing or corrupted. Downloading official Gradle 8.9 wrapper JAR..."
          mkdir -p gradle/wrapper
          curl -sSL "https://raw.githubusercontent.com/gradle/gradle/v8.9.0/gradle/wrapper/gradle-wrapper.jar" -o "$JAR_PATH"
        fi

    - name: Grant Execute Permission to Gradlew
      run: chmod +x android/gradlew

    - name: Compile and Assemble All APKs
      run: |
        cd android
        ./gradlew assembleDebug assembleRelease --no-daemon

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: Shop-Digitizer-Debug-APK
        path: android/app/build/outputs/apk/debug/*.apk

    - name: Upload Release APK Artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: Shop-Digitizer-Release-APK
        path: android/app/build/outputs/apk/release/*.apk
